# 환경변수 위치 설정
# 실행 주체마다 작업 디렉터리가 달라 두 경로를 모두 등록한다
# - Gradle 테스트: running-service/  -> 첫 번째
# - 앱 실행(IntelliJ): 저장소 루트    -> 두 번째
spring.config.import=optional:file:./.env[.properties],optional:file:./running-service/.env[.properties]

# 애플리케이션 이름
spring.application.name=running-service

# CORS 설정
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}

# HTTP 클라이언트 타임아웃 설정
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s

# 루트 API URL 설정
server.servlet.context-path=/api/v1

# 데이터베이스 설정
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis 설정
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# JPA 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL}
spring.jpa.properties.hibernate.jdbc.time_zone=${JPA_TIME_ZONE}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}

# JWT 설정
jwt.issuer=runiverse
jwt.audience=runiverse-api
jwt.access-token.secret=${JWT_ACCESS_SECRET}
jwt.access-token.ttl=${JWT_ACCESS_TTL}
jwt.refresh-token.secret=${JWT_REFRESH_SECRET}
jwt.refresh-token.ttl=${JWT_REFRESH_TTL}

# Kakao OAuth 설정
oauth.kakao.client-id=${KAKAO_REST_API_KEY}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Google OAuth 설정
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI}
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

# AWS SES 설정
mail.ses.region=${SES_REGION}
mail.ses.from=${SES_FROM_ADDRESS}
email-verification.code-ttl=5m
email-verification.cooldown=30s
email-verification.ticket-ttl=30m
email-verification.max-attempts=5
email-verification.daily-limit=10
# 로컬 테스트 전용
mail.ses.access-key-id=${SES_TEST_ACCESS_KEY_ID:}
mail.ses.secret-access-key=${SES_TEST_SECRET_ACCESS_KEY:}

# AWS S3 설정
storage.s3.region=${S3_REGION}
storage.s3.bucket=${S3_BUCKET}
storage.s3.presigned-url-ttl=10m
storage.s3.view-url-ttl=1h
# 로컬 테스트 전용 -> :는 앞의 값이 없다면 기본값 설정
storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
